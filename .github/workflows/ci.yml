name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # A frozen install: fails if bun.lock and package.json disagree.
      - run: bun ci
      - run: bun audit --audit-level=high
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      # The published files: built, loadable, and free of anything app-specific (scripts/check-package.ts).
      - run: bun run build
      - run: bun run check:package
      # The namespaces installed without their optional peers (kit/access, kit/auth/rules, kit/auth/expo),
      # an app bundle using them holds no admin or React code, and kit/admin renders with React alone.
      - run: bun run check:install
      # kit/admin in a real browser: axe (WCAG 2.1 AA) in light and dark, desktop and phone, and each component's behaviour.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
